function startScreen(){$('#screen').innerHTML=`<section class="start"><div><div class="overline">KOREAN MUSIC ARCHIVE</div><h1>기억을<br><span>재생하다.</span></h1><p class="lead">1980년대부터 2000년대까지, 세 시대에서 각각 10곡을 고릅니다. 사진 힌트를 아끼고 빠르게 맞힐수록 기록이 높아집니다.</p><div class="archive-count"><div><b>100</b><span>QUESTION BANK</span></div><div><b>30</b><span>PER ROUND</span></div><div><b>10×3</b><span>BALANCED ERAS</span></div></div></div><div class="mode-panel"><div class="mode-title">난이도를 선택하세요</div><button class="mode" data-mode="easy"><span class="mode-num">01</span><span><strong>라이트</strong><small>선명한 사진 · 편안한 플레이</small></span><span class="mode-arrow">↗</span></button><button class="mode" data-mode="normal"><span class="mode-num">02</span><span><strong>클래식</strong><small>흐린 사진 · 단계별 힌트</small></span><span class="mode-arrow">↗</span></button><button class="mode" data-mode="hard"><span class="mode-num">03</span><span><strong>마스터</strong><small>강한 블러 · 높은 점수 배율</small></span><span class="mode-arrow">↗</span></button></div></section>`;document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>begin(b.dataset.mode))}

function choices(q){return shuffle([q.a,...shuffle(BANK.filter(x=>x.a!==q.a&&x.era===q.era)).slice(0,3).map(x=>x.a)])}
function era(v){return v==='80s'?'1980년대':v==='90s'?'1990년대':'2000년대'}
function render(){locked=false;hintStep=mode==='easy'?2:0;startedAt=performance.now();const q=quiz[index],m=MODES[mode];$('#screen').innerHTML=`<section class="game"><div class="hud"><div class="progress"><i style="width:${index/TOTAL*100}%"></i></div><div class="hud-item"><span>PROGRESS</span><b>${String(index+1).padStart(2,'0')} / 30</b></div><div class="hud-item"><span>STREAK</span><b>${streak}</b></div><div class="hud-item mode-hud"><span>MODE</span><b>${m.name}</b></div></div><div class="game-grid"><div class="photo ${m.blur}" id="photo"><img src="${esc(q.photo)}" alt="가수 또는 그룹의 사진"><span class="photo-label">${era(q.era)} · PHOTO CLUE</span></div><div class="qpanel"><div class="qkicker">TRACK ${String(index+1).padStart(2,'0')}</div><h2>“${esc(q.song)}”<br>누가 불렀을까요?</h2><p class="clue">${esc(q.clue)}</p><div class="tags"><span class="tag">${esc(q.genre)}</span><span class="tag">${era(q.era)}</span></div>${mode==='easy'?'':`<button class="hint" id="hint">사진 선명하게 보기 · 점수 −20</button>`}<div class="answers">${choices(q).map(a=>`<button class="answer" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div><div id="reveal"></div></div></div></section>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.a));if($('#hint'))$('#hint').onclick=useHint}
function useHint(){if(locked||hintStep>=2)return;hintStep++;const p=$('#photo');p.classList.remove('normal','hard','step1','step2');p.classList.add(hintStep===1?'step1':'step2');if(hintStep===2)$('#hint').disabled=true;toast(hintStep===1?'사진이 조금 선명해졌습니다':'사진을 모두 공개했습니다')}
function answer(name){if(locked)return;locked=true;const q=quiz[index],ok=name===q.a,seconds=(performance.now()-startedAt)/1000,m=MODES[mode];$('#photo').className='photo reveal';document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.a===q.a)b.classList.add('correct');else if(b.dataset.a===name)b.classList.add('wrong')});if(ok){correct++;streak++;bestStreak=Math.max(bestStreak,streak);const speed=Math.max(0,Math.round(30-seconds));points+=Math.round((m.base-hintStep*20+speed)*(1+Math.min(streak-1,5)*.1))}else{misses.push({...q,chosen:name});streak=0}$('#reveal').innerHTML=`<div class="reveal-card"><p>${ok?'<strong>정답입니다.</strong> 연속 '+streak+'문제':'정답은 <strong>'+esc(q.a)+'</strong>입니다.'}<br><small>${era(q.era)} · ${esc(q.genre)} 대표곡</small></p><button class="next" id="next">${index===29?'결과 보기':'다음 문제'}</button></div>`;$('#next').focus();$('#next').onclick=()=>{index++;index<TOTAL?render():result()}}
function result(){const rate=Math.round(correct/TOTAL*100),key='kmaster-best-'+mode,old=Number(localStorage.getItem(key)||0);if(points>old)localStorage.setItem(key,points);const best=Math.max(old,points);$('#screen').innerHTML=`<section class="result"><div class="result-top"><div><div class="overline">FINAL ACCURACY</div><div class="result-num">${rate}</div></div><div><div class="overline">${MODES[mode].name.toUpperCase()} MODE</div><h1>${rate>=80?'가요 마스터입니다.':rate>=50?'기억이 선명하군요.':'새 기록을 시작해 볼까요?'}</h1><p>세 시대의 음악을 모두 지나왔습니다. 틀린 문제는 아래에서 바로 확인하고 다시 풀 수 있습니다.</p><div class="result-stats"><div><b>${points.toLocaleString()}</b><span>TOTAL POINTS</span></div><div><b>${bestStreak}</b><span>BEST STREAK</span></div><div><b>${best.toLocaleString()}</b><span>PERSONAL BEST</span></div></div><div class="actions"><button class="primary" id="again">새로운 30문제</button>${misses.length?'<button class="secondary" id="retry">오답만 다시 풀기</button>':''}</div></div></div><div class="review"><h2>오답 리뷰 · ${misses.length}</h2><div class="review-grid">${misses.length?misses.map(x=>`<div class="miss"><small>${era(x.era)} · ${esc(x.genre)}</small><b>${esc(x.song)} — ${esc(x.a)}</b><span>나의 답: ${esc(x.chosen)}</span></div>`).join(''):'<p>모든 문제를 맞혔습니다.</p>'}</div></div></section>`;$('#again').onclick=()=>begin(mode);if($('#retry'))$('#retry').onclick=()=>{quiz=shuffle(misses.map(({chosen,...q})=>q));while(quiz.length<TOTAL)quiz.push(...shuffle(BANK.filter(x=>!quiz.some(q=>q.a===x.a))).slice(0,TOTAL-quiz.length));quiz=quiz.slice(0,TOTAL);index=correct=streak=bestStreak=points=0;misses=[];render()};if(rate>=50)celebrate()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function celebrate(){const box=$('#confetti');for(let i=0;i<70;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=['#7582ff','#ff755d','#f0eee8'][i%3];p.style.animationDelay=Math.random()+'s';box.appendChild(p)}}
startScreen();
</script></body></html>
